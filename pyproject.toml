[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chief-market-cat"
version = "0.1.0"
description = "Supervised market intelligence and trading decision-support pipeline."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
  "yfinance>=0.2",
  "google-generativeai>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["cmc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
